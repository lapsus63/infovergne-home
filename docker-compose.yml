version: '3.8'

services:
  # Nginx reverse proxy (point d'entrée pour Nginx Proxy Manager)
  server:
    image: nginx:alpine
    container_name: dc-app-server
    restart: unless-stopped
    mem_limit: &mem_limit_front 128m
    memswap_limit: *mem_limit_front
    expose:
      - 80
    networks:
      - ext_dc_nginx
      - overlay
    volumes:
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/frontend/dist/client:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend

  # Frontend SSR (TanStack Start sous Bun)
  frontend:
    image: oven/bun:alpine
    container_name: dc-app-frontend
    restart: unless-stopped
    mem_limit: &mem_limit_ssr 256m
    memswap_limit: *mem_limit_ssr
    working_dir: /app
    command: bun run dist/server/server.js
    expose:
      - 3000
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-infovergne}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-infovergne}
      KEYCLOAK_AUTH_URL: ${KEYCLOAK_AUTH_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-infovergne}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-infovergne-home}
      AGENT_KEY: ${AGENT_KEY:?AGENT_KEY must be set}
    volumes:
      - ./server/frontend/dist:/app/dist:ro
    networks:
      - overlay
    depends_on:
      postgres:
        condition: service_healthy

  # Remonte au site l'état des conteneurs Docker de l'hôte.
  agent:
    build: ./agent
    container_name: dc-app-agent
    restart: unless-stopped
    environment:
      SITE_URL: https://app.infovergne.com
      AGENT_KEY: ${AGENT_KEY:?AGENT_KEY must be set}
      INTERVAL: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - overlay

  # Backend Spring Boot (Java 25)
  backend:
    image: eclipse-temurin:25-jre-alpine
    container_name: dc-app-backend
    restart: unless-stopped
    mem_limit: &mem_limit_back 512m
    memswap_limit: *mem_limit_back
    expose:
      - 8080
    command: java -jar /app/infovergne-home-backend.jar
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-infovergne}
      DATABASE_USER: ${POSTGRES_USER:-infovergne}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-infovergne}
      KEYCLOAK_AUTH_URL: ${KEYCLOAK_AUTH_URL}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-infovergne-home}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.infovergne.com,http://localhost:3000}
      JAVA_OPTS: '-Xmx${BACKEND_MEMORY:-512m} -Xms256m'
    volumes:
      - ./server/backend/infovergne-home-backend.jar:/app/infovergne-home-backend.jar:ro
      - backend-logs:/app/logs
    networks:
      - overlay
      - keycloak-network
    depends_on:
      postgres:
        condition: service_healthy

  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: dc-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infovergne}
      POSTGRES_USER: ${POSTGRES_USER:-infovergne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-infovergne}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - overlay

networks:
  overlay:
  ext_dc_nginx:
    external: true
  keycloak-network:
    external: true

volumes:
  postgres-data:
  backend-logs:
