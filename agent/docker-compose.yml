services:
  homelab-agent:
    image: alpine:3.20
    container_name: homelab-agent
    restart: unless-stopped
    command: sh -c "apk add --no-cache docker-cli curl postgresql16-client coreutils >/dev/null && sh /agent/agent.sh"
    environment:
      SITE_URL: https://lab.exemple.fr
      AGENT_KEY: change-moi
      DATABASE_URL: postgres://user:motdepasse@postgres:5432/homelab
      INTERVAL: '60'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./agent.sh:/agent/agent.sh:ro
      - ./backups:/backups
